<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briç Fotoğraf Sıkıştırıcı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; }
        .input-group {
            margin-bottom: 15px;
            font-size: 18px;
        }
        input[type="number"] {
            width: 80px;
            padding: 8px;
            font-size: 18px;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-capture { background-color: #3498db; }
        #status {
            font-weight: bold;
            color: #7f8c8d;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Briç Fotoğraf Sıkıştırıcı</h2>
    
    <div class="input-group">
        <label for="bordNo">Bord No: </label>
        <input type="number" id="bordNo" value="1" min="1" max="36">
    </div>

    <!-- Kamerayı tetikleyen gizli input -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    
    <button class="btn btn-capture" onclick="document.getElementById('cameraInput').click()">📷 FOTOĞRAF ÇEK</button>
    
    <div id="status">Hazır. Fotoğraf çekilmesi bekleniyor...</div>
</div>

<script>
    document.getElementById('cameraInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('status').innerText = "Resim işleniyor ve indiriliyor...";
        const reader = new FileReader();
        
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // ÖNEMLİ: Çözünürlüğü ve pikselleri korumak için orijinal boyutları alıyoruz
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0, img.width, img.height);

                // Görüntünün piksellerini öldürmeden dijital kalitesini %50'ye çekerek dosyayı 100-150 KB'a düşürüyoruz
                canvas.toBlob(function(blob) {
                    const bordNo = document.getElementById('bordNo').value;
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    
                    // Dosyayı doğrudan .jpg fotoğrafı olarak isimlendirip indiriyoruz
                    link.download = `bord_${bordNo}.jpg`;
                    link.click();

                    document.getElementById('status').innerText = `Bord ${bordNo} fotoğrafı (.jpg) indirildi!`;
                    
                    // Bir sonraki çekim için bord numarasını otomatik 1 artırıyoruz
                    document.getElementById('bordNo').value = parseInt(bordNo) + 1;
                }, 'image/jpeg', 0.50);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
